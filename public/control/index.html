<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Control — Multicam</title>
<link rel="stylesheet" href="/shared/theme.css">
<link rel="stylesheet" href="/graphics/graphics.css">
<link rel="stylesheet" href="/control/control.css">
<header id="bar">
  <span id="conn" class="dot" title="conexión"></span>
  <strong>Multicam</strong>
  <button id="btn-cut" class="take">CUT <kbd>Enter</kbd></button>
  <button id="btn-fade" class="take">FADE <kbd>Espacio</kbd></button>
  <span class="sizes">
    <label>Tamaño de Preview/Program <input id="sz-big" type="range" min="0.2" max="0.5" step="0.01"></label>
    <button id="sz-reset" title="Tamaños por defecto">↺</button>
  </span>
  <span id="vol" title="Volumen (diales del macropad o teclas - =  m)"></span>
  <span id="warn" hidden></span>
</header>
<section id="gcpanel">
  <label>Equipo <select id="gc-team"></select></label>
  <label>Jugador <select id="gc-player"></select></label>
  <span class="grp">GC nombre:
    <button data-gc="name" data-act="arm">a preview</button>
    <button data-gc="name" data-act="live">al aire</button>
    <button data-gc="name" data-act="off">bajar</button>
  </span>
  <span class="grp">Marcador:
    <button data-gc="score" data-act="arm">a preview</button>
    <button data-gc="score" data-act="live">al aire</button>
    <button data-gc="score" data-act="off">bajar</button>
  </span>
  <button id="btn-emergency" class="danger">EMERGENCIA</button>
</section>
<section id="vtrpanel">
  <strong>VTR</strong>
  <select id="vtr-files"></select>
  <button id="vtr-play">▶</button><button id="vtr-pause">⏸</button><button id="vtr-next">⏭</button>
  <span id="vtr-empty" hidden>sin archivos en la carpeta vtr/</span>
</section>
<main id="mv"></main>
<section id="splitpanel">
  <div class="sp-row">
    <strong>Pantalla dividida</strong>
    <label>Cámaras
      <select id="sp-count"><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select>
    </label>
    <label>Fondo <select id="sp-bg"></select></label>
    <label class="chk"><input type="checkbox" id="sp-lock" checked> mantener 16:9</label>
    <button id="sp-reset">Restablecer posiciones</button>
    <button id="sp-preview">Dividida a Preview</button>
  </div>
  <div class="sp-row">
    <strong>Peleas</strong>
    <input id="sp-name" placeholder="Nombre (ej. Pelea 1)" maxlength="40">
    <button id="sp-save">Guardar</button>
    <select id="sp-fights"></select>
    <button id="sp-load">Cargar</button>
    <button id="sp-delete">Borrar</button>
  </div>
  <div class="sp-editor">
    <div id="sp-slots"></div>
    <div id="sp-canvas"></div>
  </div>
</section>
<script type="module" src="/control/control.js"></script>
